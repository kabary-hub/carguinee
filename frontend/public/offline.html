<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne — Carguinée</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #1e293b;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 400px;
      background: white;
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #059669;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #047857; }
    .features {
      margin-top: 2rem;
      text-align: left;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .features li { margin: 0.3rem 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>
      Il semble que vous n'ayez pas de connexion internet.
      Vérifiez votre réseau et réessayez.
    </p>
    <button onclick="window.location.reload()">↻ Réessayer</button>
    <ul class="features">
      <li>✅ Les pages visitées récemment sont accessibles</li>
      <li>✅ Le catalogue véhicules est en cache</li>
      <li>⏳ La messagerie nécessite une connexion</li>
    </ul>
  </div>
</body>
</html>
