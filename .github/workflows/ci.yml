name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annuler les runs précédents quand un nouveau push arrive sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variables communes
  NODE_ENV: test

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (typecheck + tests + build)
    runs-on: ubuntu-latest

    # PostgreSQL pour les tests d'intégration
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carguinee_ci
          POSTGRES_PASSWORD: carguinee_ci
          POSTGRES_DB: carguinee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U carguinee_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://carguinee_ci:carguinee_ci@localhost:5432/carguinee_test
      JWT_SECRET: ci-test-secret-key-that-is-at-least-32-characters
      ENCRYPTION_KEY: aabbccdd11223344aabbccdd11223344aabbccdd11223344aabbccdd11223344
      RESEND_API_KEY: re_test_placeholder
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push schema to test database
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests unitaires et intégration
        run: npm test

      - name: Build production
        run: npx tsc

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Build production
        run: npx vite build
