name: CI - Lint & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/carguine_test?schema=public"

jobs:
  # ─── BACKEND ──────────────────────────────────────────────
  backend-test:
    name: "Backend: Tests & Lint"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carguine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carguine_test?schema=public

      - name: Seed database
        run: npx tsx prisma/seed-faq.ts
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carguine_test?schema=public

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carguine_test?schema=public
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 1h
        run: npx tsx --test src/**/*.test.ts tests/**/*.test.ts 2>&1 || true

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit 2>&1 | head -50
        continue-on-error: true

  # ─── FRONTEND ────────────────────────────────────────────
  frontend-build:
    name: "Frontend: Build & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit 2>&1 | head -50
        working-directory: frontend
        continue-on-error: true

      - name: Build
        run: npx vite build
        working-directory: frontend

  # ─── DOCKER BUILD ────────────────────────────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t carguine-backend:latest ./backend

      - name: Build frontend image
        run: docker build -t carguine-frontend:latest ./frontend
