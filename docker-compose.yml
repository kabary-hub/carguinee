# ══════════════════════════════════════════════════════════════════════════════
# CarGuinée — Docker Compose (Développement)
#
# Usage :
#   docker compose up           → tout démarrer
#   docker compose up -d        → en arrière-plan
#   docker compose down         → tout arrêter
#   docker compose logs -f      → voir les logs en temps réel
#
# Les utilisateurs de test sont créés automatiquement au démarrage :
#   620980117 / 12345678 (CLIENT)
#   620980118 / 12345678 (PROPRIETAIRE)
#   620980119 / 12345678 (ADMIN)
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: carguinee-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carguinee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carguinee"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Cache) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: carguinee-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express + Prisma) ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carguinee-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/carguinee?schema=public"
      JWT_SECRET: "dev-jwt-secret-change-in-production-min-32-chars-here"
      PORT: 3000
      CORS_ORIGIN: "http://localhost:5173"
      LIBRETRANSLATE_URL: "http://localhost:5000"
      LIBRETRANSLATE_API_KEY: ""
      TRANSLATION_ENABLED: "false"
      ENCRYPTION_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      OM_APP_KEY: ""
      OM_APP_SECRET: ""
      OM_MERCHANT_KEY: ""
      OM_SANDBOX: "true"
      MAPBOX_TOKEN: ""
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "development"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - backend-uploads:/app/uploads

  # ── Frontend (Vite + React) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carguinee-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  pgdata:
  backend-uploads:
